# Parâmetros dos nós do pantilt_ros.
# Nomes e padrões seguem docs/architecture.md (seção 4).
# Unidades SI; graus só em parâmetros com sufixo _deg.

serial_bridge_node:
  ros__parameters:
    device: "/dev/ttyUSB0"         # resolvido pelo entrypoint via VID:PID
    baud: 921600                   # deve bater com SERIAL_BAUD do firmware
    heartbeat_hz: 5.0              # deve ser maior que 1 / FAILSAFE_TIMEOUT_MS (2 Hz)
    pan_limits_deg: [-30.0, 30.0]  # limite físico
    tilt_limits_deg: [-90.0, 90.0] # limite físico
    limit_margin_deg: 1.0          # margem antes do limite
    reconnect_interval_s: 1.0      # espera entre tentativas de abrir a serial
    stale_timeout_s: 1.0           # sem frames da ESP32 por mais que isso -> aviso em /ptu/errors

command_mux:
  ros__parameters:
    operator_hold_s: 1.0           # janela de prioridade do operador após o último comando da web
    cmd_timeout_s: 0.3             # watchdog: fonte ativa em silêncio por mais que isso -> velocidade zero

camera_node:
  ros__parameters:
    source: "0"                    # índice (/dev/videoN), URL (ex.: MJPEG do Windows) ou caminho de vídeo
    width: 640                     # resolução solicitada (a fonte pode entregar outra; ver log)
    height: 480
    fps: 30.0                      # taxa máxima de publicação
    frame_id: "camera_optical_frame"  # frame do header
    # intrínsecos para /camera/camera_info: gerado pelo calibration_node; ausente -> K zerada
    # (sem calibração). Lido só no início: depois de calibrar, reinicie o camera_node
    camera_info_file: "/ros2_ws/src/pantilt_ros/pantilt_bringup/config/camera_intrinsics.yaml"
    camera_name: "pantilt_cam"     # nome gravado no arquivo de calibração

detector_node:
  ros__parameters:
    model_path: "/ros2_ws/models/yolo11n.pt"   # pesos (fora do git; o nó não baixa); trocar pelo modelo treinado
    # equipamentos: COCO de teste até o modelo do TCC existir; depois, .../config/equipment.yaml
    equipment_file: "/ros2_ws/src/pantilt_ros/pantilt_bringup/config/equipment_coco_test.yaml"
    conf_threshold: 0.5            # confiança mínima, em (0, 1]
    imgsz: 640                     # tamanho de inferência (múltiplo de 32); menor = mais rápido em CPU
    device: "cpu"                  # "cpu" ou "cuda:0" (o container atual não tem CUDA)
    publish_debug_image: true      # imagem com as bboxes para a web (só desenhada com assinante)

calibration_node:
  ros__parameters:
    probe_deg: 3.0                 # amplitude da sondagem inicial do pan (f grosseiro)
    max_angle_deg: 10.0            # ângulo máximo da grade em cruz (limita a distorção; máx. 20)
    n_points: 7                    # pontos por eixo, simétricos em torno do home
    samples_per_point: 5           # alvos por ponto (usa a mediana)
    settle_tol_deg: 0.2            # tolerância para considerar a junta parada no alvo
    settle_extra_s: 0.4            # espera extra após a parada (atraso da imagem)
    min_points: 4                  # mínimo de pontos válidos por eixo (pelo menos 3)
    # arquivo gerado: o mesmo camera_info_file do camera_node
    output_file: "/ros2_ws/src/pantilt_ros/pantilt_bringup/config/camera_intrinsics.yaml"
    camera_name: "pantilt_cam"     # nome gravado no arquivo (igual ao do camera_node)

scan_node:
  ros__parameters:
    pan_min_deg: -28.0             # margem de 2° dos limites físicos (±30°)
    pan_max_deg: 28.0
    tilt_levels_deg: [-20.0, 0.0, 20.0]  # faixas de tilt (use sempre ponto decimal: lista de double)
    speed_deg_s: 15.0              # velocidade da varredura (máx. 30); baixa para a YOLO acompanhar
    timeout_s: 60.0                # tempo máximo de um goal (0 no goal usa este valor)
    rate_hz: 20.0                  # taxa do laço

visual_servo_node:
  ros__parameters:
    controller: "pid"              # "pid" ou "fuzzy" (fuzzy ainda não implementado)
    # entrada: erro ANGULAR (rad); saída: velocidade angular (rad/s)
    # kp [1/s] equivale ao ganho λ do IBVS (teto teórico ~3); ki [1/s²]; kd [adimensional]
    pan:
      kp: 0.8
      ki: 0.0                      # ativar só no ensaio com alvo em movimento
      kd: 0.0                      # ativar só após o PI estável
    tilt:
      kp: 0.8
      ki: 0.0
      kd: 0.0
    derivative_filter_hz: 2.0      # corte do filtro de 1ª ordem da derivada
    max_vel_deg_s: 20.0            # saturação da saída (máx. 30)
    integral_limit_deg_s: 10.0     # teto da contribuição integral
    invert_pan: false              # convenção de sinal: definida no teste de bancada (tarefa E)
    invert_tilt: true
    publish_rate_hz: 20.0          # taxa de publicação em /ptu/cmd_vel_auto
    cmd_hold_s: 0.25               # repete o último comando por até este tempo sem alvo novo
    limit_timeout_s: 2.0           # eixo parado com comando empurrando por mais que isso -> aborta

inspection_manager:
  ros__parameters:
    # equipamentos: deve ser o mesmo equipment_file do detector_node
    equipment_file: "/ros2_ws/src/pantilt_ros/pantilt_bringup/config/equipment_coco_test.yaml"
    confirm_frames: 3              # alvos consecutivos (detected=true) para confirmar a detecção
    scan_timeout_s: 60.0           # tempo máximo da passada de varredura (uma por SEARCHING)
    max_reacquire: 2               # perdas consecutivas do alvo que ainda levam a nova varredura
    # repassados ao goal Center do visual_servo_node
    tolerance_px: 20.0             # erro máximo para considerar centralizado
    hold_time_s: 1.0               # tempo contínuo dentro da tolerância
    lost_timeout_s: 1.0            # tempo sem alvo até a Center abortar com "alvo perdido"

capture_node:
  ros__parameters:
    output_dir: "/ros2_ws/datasets"  # pasta dos vídeos (fora do src/ e do git; visível no Windows)
    record_fps: 15.0               # taxa máxima gravada (o MP4 declara esta taxa)
    fourcc: "mp4v"                 # codec do OpenCV (4 caracteres)
    min_free_gb: 1.0               # espaço livre mínimo para iniciar e continuar gravando
    queue_size: 30                 # fila do escritor; cheia -> quadros descartados (CaptureStatus.dropped)
