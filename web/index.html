<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>PTU Control</title>
<script src="https://cdn.jsdelivr.net/npm/roslib@1/build/roslib.min.js"></script>
<style>
  :root{
    --bg: #14161a;
    --panel: #1d2025;
    --panel-2: #23262c;
    --line: #33373f;
    --text: #e8e9ec;
    --text-dim: #8b909a;
    --accent: #ff8a3d;
    --accent-dim: #6b431f;
    --good: #3ddc84;
    --bad: #ff5c5c;
    --mono: 'SF Mono', 'Consolas', 'Menlo', monospace;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap{ max-width: 460px; margin: 0 auto; padding: 14px 14px 32px; }

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 6px 2px 16px;
  }
  .topbar h1{ font-size: 15px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--text-dim); margin:0; }
  .pill{
    font-size: 11px; font-weight: 700; letter-spacing:.04em; text-transform:uppercase;
    padding: 4px 10px; border-radius: 20px; display:flex; align-items:center; gap:6px;
    background: var(--panel-2); color: var(--text-dim);
  }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--bad); flex-shrink:0; }
  .pill.on .dot{ background: var(--good); box-shadow: 0 0 6px var(--good); }
  .pill.on{ color: var(--good); }

  .card{
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 12px;
  }
  .card-title{
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
    color: var(--text-dim); margin-bottom: 12px; display:flex; justify-content:space-between; align-items:center;
  }

  /* Telemetria */
  .telem-grid{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .telem-box{ background: var(--panel-2); border-radius: 10px; padding: 12px 10px; text-align:center; }
  .telem-axis{ font-size: 10px; letter-spacing:.1em; text-transform:uppercase; color: var(--text-dim); margin-bottom: 4px; }
  .telem-val{ font-family: var(--mono); font-size: 26px; font-weight: 600; color: var(--accent); line-height:1; }
  .telem-val small{ font-size: 14px; color: var(--text-dim); font-weight:400; margin-left:2px; }
  .telem-vel{ font-family: var(--mono); font-size: 12px; color: var(--text-dim); margin-top: 6px; }
  .telem-vel b{ color: var(--text); font-weight:600; }

  /* Posição */
  .pos-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .field label{ font-size: 11px; color: var(--text-dim); display:block; margin-bottom: 5px; letter-spacing:.03em; }
  .field input[type=number]{
    width:100%; padding: 11px 10px; background: var(--panel-2); border:1px solid var(--line);
    border-radius: 8px; color: var(--text); font-family: var(--mono); font-size: 16px;
  }
  .field input[type=number]:focus{ outline:none; border-color: var(--accent); }
  .btn{
    width:100%; padding: 13px; border:none; border-radius: 9px; font-weight:700; font-size: 13px;
    letter-spacing:.03em; text-transform:uppercase; cursor:pointer; color:#14161a; background: var(--accent);
    transition: transform .05s ease, filter .1s ease;
  }
  .btn:active{ transform: scale(0.97); filter: brightness(0.9); }
  .btn-ghost{ background: var(--panel-2); color: var(--text); border:1px solid var(--line); }
  .btn-danger{ background: var(--bad); color:#1a1a1a; }
  .btn-row{ display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* Jog */
  .jog-speed-row{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom: 14px; }
  .jog-speed-row label{ font-size: 11px; color: var(--text-dim); display:flex; justify-content:space-between; margin-bottom:5px;}
  .jog-speed-row label span{ color: var(--accent); font-family: var(--mono); }
  input[type=range]{ width:100%; accent-color: var(--accent); }

  .jog-grid{ display:grid; grid-template-columns: 64px 64px 64px; gap: 8px; justify-content:center; margin-top: 4px;}
  .jog-btn{
    width:64px; height:64px; border-radius: 12px; border:1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 22px; font-weight:700;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .jog-btn:active, .jog-btn.pressed{ background: var(--accent-dim); border-color: var(--accent); color: var(--accent); }
  .jog-btn.stop{ background: var(--bad); color:#1a1a1a; font-size: 11px; letter-spacing:.05em; text-transform:uppercase; border:none; }
  .jog-btn.stop:active{ filter: brightness(0.85); }
  .jog-empty{ visibility:hidden; }

  .toast{
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border:1px solid var(--line); color: var(--text);
    padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity:0; pointer-events:none;
    transition: opacity .2s ease, transform .2s ease; max-width: 90%; text-align:center;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-6px); }

  .log-entry{ font-size: 12px; font-family: var(--mono); padding: 6px 8px; border-radius: 6px; background: var(--panel-2); display:flex; gap:8px; }
  .log-entry .log-time{ color: var(--text-dim); flex-shrink:0; }
  .log-entry.is-error{ border-left: 3px solid var(--bad); }
  .log-entry.is-boot{ border-left: 3px solid var(--accent); }
  .log-entry.is-info{ border-left: 3px solid var(--good); }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <h1>Controle PTU</h1>
    <div style="display:flex; gap:8px; align-items:center;">
      <div class="pill" id="source-pill"><span class="dot" style="background:var(--text-dim)"></span><span id="source-text">—</span></div>
      <div class="pill" id="conn-pill"><span class="dot"></span><span id="conn-text">Offline</span></div>
    </div>
  </div>

  <!-- Telemetria -->
  <div class="card">
    <div class="card-title">Telemetria</div>
    <div class="telem-grid">
      <div class="telem-box">
        <div class="telem-axis">Pan</div>
        <div class="telem-val" id="pan_pos">0.0<small>°</small></div>
        <div class="telem-vel">vel <b id="pan_vel">0.0</b>°/s</div>
      </div>
      <div class="telem-box">
        <div class="telem-axis">Tilt</div>
        <div class="telem-val" id="tilt_pos">0.0<small>°</small></div>
        <div class="telem-vel">vel <b id="tilt_vel">0.0</b>°/s</div>
      </div>
    </div>
  </div>

  <!-- Posição -->
  <div class="card">
    <div class="card-title">Ir para posição</div>
    <div class="pos-row">
      <div class="field">
        <label>Pan alvo (°)</label>
        <input type="number" id="pos_pan" value="0" step="1">
      </div>
      <div class="field">
        <label>Tilt alvo (°)</label>
        <input type="number" id="pos_tilt" value="0" step="1">
      </div>
    </div>
    <button class="btn" onclick="enviarPosicao()">Mover</button>
  </div>

  <!-- Jog -->
  <div class="card">
    <div class="card-title">Jog (velocidade)</div>
    <div class="jog-speed-row">
      <label>Vel. Pan <span id="v_pan_lbl">30</span>°/s
        <input type="range" id="v_pan" min="1" max="90" value="30" style="grid-column:1/-1; margin-top:6px;">
      </label>
      <label>Vel. Tilt <span id="v_tilt_lbl">20</span>°/s
        <input type="range" id="v_tilt" min="1" max="90" value="20" style="grid-column:1/-1; margin-top:6px;">
      </label>
    </div>

    <div class="jog-grid">
      <div class="jog-empty"></div>
      <button class="jog-btn" data-eixo="tilt" data-dir="1">▲</button>
      <div class="jog-empty"></div>

      <button class="jog-btn" data-eixo="pan" data-dir="-1">◄</button>
      <button class="jog-btn stop" id="btn-stop">STOP</button>
      <button class="jog-btn" data-eixo="pan" data-dir="1">►</button>

      <div class="jog-empty"></div>
      <button class="jog-btn" data-eixo="tilt" data-dir="-1">▼</button>
      <div class="jog-empty"></div>
    </div>
  </div>

  <!-- Diagnóstico -->
  <div class="card">
    <div class="card-title">
      <span>Diagnóstico</span>
      <span id="err-count" style="color:var(--text-dim); font-weight:400; text-transform:none;"></span>
    </div>
    <div id="log-list" style="display:flex; flex-direction:column; gap:6px; max-height:160px; overflow-y:auto;">
      <div style="color:var(--text-dim); font-size:12px;">Nenhum evento ainda.</div>
    </div>
  </div>

  <!-- Ações -->
  <div class="card">
    <div class="card-title">Ações</div>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="zerarEixos()">Zerar Encoders</button>
      <button class="btn btn-danger" onclick="pararTudo()">Parar Tudo</button>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  const RAD_TO_DEG = 57.2957795;
  const DEG_TO_RAD = 0.0174532925;

  // ---------------- Conexão ----------------
  const ros = new ROSLIB.Ros({ url: 'ws://' + window.location.hostname + ':9090' });
  const pill = document.getElementById('conn-pill');
  const connText = document.getElementById('conn-text');

  ros.on('connection', () => {
    pill.classList.add('on');
    connText.textContent = 'Online';
  });
  ros.on('close', () => {
    pill.classList.remove('on');
    connText.textContent = 'Offline';
  });
  ros.on('error', () => {
    pill.classList.remove('on');
    connText.textContent = 'Erro';
  });

  // ---------------- Tópicos ----------------
  const jointStateSub = new ROSLIB.Topic({ ros, name: '/joint_states', messageType: 'sensor_msgs/JointState' });
  jointStateSub.subscribe((msg) => {
    for (let i = 0; i < msg.name.length; i++) {
      const pos = (msg.position[i] * RAD_TO_DEG).toFixed(1);
      const vel = (msg.velocity[i] * RAD_TO_DEG).toFixed(1);
      if (msg.name[i] === 'pan_joint') {
        document.getElementById('pan_pos').innerHTML = pos + '<small>°</small>';
        document.getElementById('pan_vel').textContent = vel;
      } else if (msg.name[i] === 'tilt_joint') {
        document.getElementById('tilt_pos').innerHTML = pos + '<small>°</small>';
        document.getElementById('tilt_vel').textContent = vel;
      }
    }
  });

  const cmdPosPub = new ROSLIB.Topic({ ros, name: '/ptu/cmd_pos_web', messageType: 'sensor_msgs/JointState' });
  const cmdVelPub = new ROSLIB.Topic({ ros, name: '/ptu/cmd_vel_web', messageType: 'geometry_msgs/Twist' });
  const setZeroClient = new ROSLIB.Service({ ros, name: '/ptu/set_zero', serviceType: 'std_srvs/Trigger' });

  // ---------------- Diagnóstico (erros / boot da ESP32) ----------------
  const errorsSub = new ROSLIB.Topic({ ros, name: '/ptu/errors', messageType: 'std_msgs/String' });
  const logList = document.getElementById('log-list');
  const errCountEl = document.getElementById('err-count');
  let errCount = 0;
  let firstLog = true;

  errorsSub.subscribe((msg) => {
    if (firstLog) { logList.innerHTML = ''; firstLog = false; }

    const text = msg.data || '';
    const isError = text.includes('ERRO');
    const isBoot = text.includes('BOOT');

    const entry = document.createElement('div');
    entry.className = 'log-entry ' + (isError ? 'is-error' : isBoot ? 'is-boot' : 'is-info');
    entry.textContent = text;
    logList.prepend(entry);

    while (logList.children.length > 30) logList.removeChild(logList.lastChild);

    if (isError) {
      errCount++;
      errCountEl.textContent = errCount + ' erro(s)';
    }
  });

  // ---------------- Fonte de controle ativa (web / joystick) ----------------
  const activeSourceSub = new ROSLIB.Topic({ ros, name: '/ptu/active_source', messageType: 'std_msgs/String' });
  const sourcePill = document.getElementById('source-pill');
  const sourceText = document.getElementById('source-text');

  activeSourceSub.subscribe((msg) => {
    const src = msg.data;
    sourceText.textContent = src === 'web' ? 'Você (Web)' : src === 'joystick' ? 'Joystick' : src;
    sourcePill.querySelector('.dot').style.background = src === 'web' ? 'var(--good)' : 'var(--accent)';
  });

  // ---------------- Posição ----------------
  function enviarPosicao() {
    const pan = parseFloat(document.getElementById('pos_pan').value) || 0;
    const tilt = parseFloat(document.getElementById('pos_tilt').value) || 0;
    cmdPosPub.publish(new ROSLIB.Message({
      name: ['pan_joint', 'tilt_joint'],
      position: [pan * DEG_TO_RAD, tilt * DEG_TO_RAD]
    }));
    showToast(`Movendo para Pan ${pan}° / Tilt ${tilt}°`);
  }

  // ---------------- Jog (velocidade) ----------------
  function enviarVelocidade(panDegS, tiltDegS) {
    cmdVelPub.publish(new ROSLIB.Message({
      linear: { x: 0, y: 0, z: 0 },
      angular: { x: 0, y: tiltDegS * DEG_TO_RAD, z: panDegS * DEG_TO_RAD }
    }));
  }

  function pararTudo() {
    enviarVelocidade(0, 0);
    showToast('Parado');
  }

  const vPanSlider = document.getElementById('v_pan');
  const vTiltSlider = document.getElementById('v_tilt');
  vPanSlider.addEventListener('input', () => document.getElementById('v_pan_lbl').textContent = vPanSlider.value);
  vTiltSlider.addEventListener('input', () => document.getElementById('v_tilt_lbl').textContent = vTiltSlider.value);

  document.querySelectorAll('.jog-btn[data-eixo]').forEach(btn => {
    const eixo = btn.dataset.eixo;
    const dir = parseFloat(btn.dataset.dir);

    const iniciar = (e) => {
      e.preventDefault();
      btn.classList.add('pressed');
      const vel = parseFloat(eixo === 'pan' ? vPanSlider.value : vTiltSlider.value) * dir;
      if (eixo === 'pan') enviarVelocidade(vel, 0);
      else enviarVelocidade(0, vel);
    };
    const parar = (e) => {
      if (e) e.preventDefault();
      btn.classList.remove('pressed');
      pararTudo();
    };

    btn.addEventListener('mousedown', iniciar);
    btn.addEventListener('touchstart', iniciar, { passive: false });
    btn.addEventListener('mouseup', parar);
    btn.addEventListener('mouseleave', parar);
    btn.addEventListener('touchend', parar);
    btn.addEventListener('touchcancel', parar);
  });

  document.getElementById('btn-stop').addEventListener('click', pararTudo);

  // ---------------- Zerar ----------------
  function zerarEixos() {
    setZeroClient.callService(new ROSLIB.ServiceRequest({}), (result) => {
      showToast(result.message || (result.success ? 'Eixos zerados' : 'Falha ao zerar'));
    });
  }

  // ---------------- Toast ----------------
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }
</script>
</body>
</html>
